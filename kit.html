
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6b1f32">
  <title>Kit | DEAR,</title>
  <meta name="description" content="Descubra os kits DEAR, feitos para cuidar de quem importa.">

  <style>
    :root {
      --wine: #6b1f32;
      --wine-dark: #481321;
      --cream: #faf6f0;
      --text: #282020;
      --muted: #766b6b;
      --border: #e8ded8;
      --soft: #f0e6df;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--cream);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.6;
    }

    a {
      color: inherit;
    }

    header {
      border-bottom: 1px solid var(--border);
      padding: 18px 6%;
    }

    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
    }

    .brand img {
      display: block;
      width: 130px;
      max-height: 70px;
      height: auto;
      object-fit: contain;
    }

    .back-link {
      color: var(--wine);
      font-size: 14px;
      text-decoration: none;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    main {
      max-width: 1050px;
      margin: 0 auto;
      padding: 44px 22px 70px;
      min-height: 65vh;
    }

    .product-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 48px;
      align-items: start;
    }

    .product-visual {
      min-height: 380px;
      padding: 28px;
      background: var(--soft);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .visual-logo {
      width: 75%;
      max-width: 260px;
      height: auto;
      object-fit: contain;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--wine);
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 16px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(30px, 5vw, 44px);
      font-weight: normal;
      line-height: 1.2;
    }

    .description {
      margin: 0 0 22px;
      color: var(--muted);
      white-space: pre-line;
    }

    .price {
      margin: 0 0 24px;
      color: var(--wine);
      font-size: 29px;
      font-weight: bold;
    }

    .details {
      margin-top: 25px;
      padding: 22px 0;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .details h2 {
      margin: 0 0 14px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 23px;
      font-weight: normal;
    }

    .components {
      margin: 0;
      padding-left: 22px;
    }

    .components li {
      margin: 8px 0;
    }

    .extra-detail {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .message {
      padding: 40px 12px;
      text-align: center;
      color: var(--muted);
    }

    .message h1 {
      color: var(--text);
      font-size: 30px;
    }

    .message a {
      display: inline-block;
      margin-top: 14px;
      color: var(--wine);
    }

    .loading {
      color: var(--wine);
    }

    footer {
      padding: 25px 20px;
      border-top: 1px solid var(--border);
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 700px) {
      header {
        padding: 16px 18px;
      }

      .brand img {
        width: 105px;
        max-height: 58px;
      }

      main {
        padding: 28px 18px 50px;
      }

      .product-layout {
        grid-template-columns: 1fr;
        gap: 28px;
      }

      .product-visual {
        min-height: 250px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="header-inner">
      <a class="brand" href="index.html" aria-label="DEAR, página inicial">
        <img
          src="7F329F3D-1642-4AC1-B5E9-6C3BFEBD8FD9.png"
          alt="DEAR,"
          onerror="this.style.display='none'; this.parentElement.textContent='DEAR,';"
        >
      </a>

      <a class="back-link" href="index.html#catalogo">
        ← Voltar à loja
      </a>
    </div>
  </header>

  <main>
    <section id="product-content" class="message" aria-live="polite">
      <p class="loading">Carregando os detalhes do kit...</p>
    </section>
  </main>

  <footer>DEAR, — Made to care.</footer>

  <script>
    const SUPABASE_URL = "https://tfqksmhwumnjvfjoxavj.supabase.co";
    const SUPABASE_KEY = "sb_publishable_-2mMLVDYefI-ytu2m7vMTQ_QCIbYdHK";

    const content = document.getElementById("product-content");
    const kitId = new URLSearchParams(window.location.search).get("id");
    const logoPath = "7F329F3D-1642-4AC1-B5E9-6C3BFEBD8FD9.png";

    function showMessage(title, message) {
      content.className = "message";
      content.replaceChildren();

      const heading = document.createElement("h1");
      heading.textContent = title;

      const paragraph = document.createElement("p");
      paragraph.textContent = message;

      const link = document.createElement("a");
      link.href = "index.html#catalogo";
      link.textContent = "Voltar para os kits";

      content.append(heading, paragraph, link);
    }

    function addText(parent, tag, className, text) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      element.textContent = text;
      parent.appendChild(element);
      return element;
    }

    function formatPrice(value) {
      const price = Number(value);

      if (!Number.isFinite(price)) {
        return "Consulte o valor";
      }

      return price.toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL"
      });
    }

    function letterLabel(option) {
      const labels = {
        template: "Carta da DEAR,",
        custom: "Carta personalizada",
        none: "Sem carta"
      };

      return labels[option] || "";
    }

    async function loadKit() {
      if (!kitId) {
        showMessage(
          "Escolha seu kit",
          "Acesse a loja e selecione o kit que deseja conhecer."
        );
        return;
      }

      try {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 12000);

        let response;

        try {
          response = await fetch(
            SUPABASE_URL +
              "/rest/v1/public_active_kits" +
              "?select=id,name,collection,description,sale_price,size,variation,letter_option,petal_colors,components" +
              "&id=eq." + encodeURIComponent(kitId) +
              "&limit=1",
            {
              method: "GET",
              headers: {
                "apikey": SUPABASE_KEY,
                "Authorization": "Bearer " + SUPABASE_KEY
              },
              signal: controller.signal
            }
          );
        } finally {
          clearTimeout(timeout);
        }

        if (!response.ok) {
          console.error("Falha ao consultar o kit:", response.status);
          showMessage(
            "Não foi possível carregar o kit",
            "Houve um problema ao consultar a loja. Tente novamente."
          );
          return;
        }

        const kits = await response.json();
        const kit = Array.isArray(kits) ? kits[0] : null;

        if (!kit) {
          showMessage(
            "Kit não encontrado",
            "Este kit pode não estar disponível no momento."
          );
          return;
        }

        renderKit(kit);
      } catch (error) {
        console.error("Erro ao carregar o kit:", error);

        showMessage(
          "Não conseguimos carregar esta página",
          "Verifique sua conexão e tente novamente."
        );
      }
    }

    function renderKit(kit) {
      content.className = "";
      content.replaceChildren();

      const layout = document.createElement("div");
      layout.className = "product-layout";

      const visual = document.createElement("div");
      visual.className = "product-visual";

      const visualLogo = document.createElement("img");
      visualLogo.className = "visual-logo";
      visualLogo.src = logoPath;
      visualLogo.alt = "DEAR,";
      visualLogo.onerror = function () {
        this.style.display = "none";
        const fallback = document.createElement("span");
        fallback.textContent = "DEAR,";
        fallback.style.cssText =
          "color:#6b1f32;font-family:Georgia,serif;font-size:52px;";
        visual.appendChild(fallback);
      };
      visual.appendChild(visualLogo);

      const info = document.createElement("div");

      addText(info, "p", "eyebrow", kit.collection || "Coleção DEAR");
      addText(info, "h1", "", kit.name || "Kit DEAR");

      if (kit.description) {
        addText(info, "p", "description", kit.description);
      }

      addText(info, "p", "price", formatPrice(kit.sale_price));

      const details = document.createElement("section");
      details.className = "details";
      addText(details, "h2", "", "O que vem no kit");

      const list = document.createElement("ul");
      list.className = "components";

      if (Array.isArray(kit.components) && kit.components.length) {
        kit.components.forEach(item => {
          const quantity = Number(item.quantity) || 1;
          addText(list, "li", "", quantity + "x " + item.name);
        });

        details.appendChild(list);
      } else {
        addText(details, "p", "", "Itens não informados.");
      }

      if (kit.size) {
        addText(details, "p", "extra-detail", "Tamanho: " + kit.size);
      }

      if (kit.variation) {
        addText(details, "p", "extra-detail", "Variação: " + kit.variation);
      }

      const letter = letterLabel(kit.letter_option);
      if (letter) {
        addText(details, "p", "extra-detail", "Opção de carta: " + letter);
      }

      if (Array.isArray(kit.petal_colors) && kit.petal_colors.length) {
        addText(
          details,
          "p",
          "extra-detail",
          "Cores de pétalas: " + kit.petal_colors.join(", ")
        );
      }

      info.appendChild(details);
      layout.append(visual, info);
      content.appendChild(layout);

      document.title = (kit.name || "Kit") + " | DEAR,";
    }

    loadKit();
  </script>
</body>
</html>
